<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px; padding: 24px;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
}
.brand { font-size: 28px; font-weight: 700; color: #4f46e5; margin: 0; }
.spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 4px solid rgba(128,128,128,.3); border-top-color: #4f46e5;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#status { margin: 0; }
#manual { display: none; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
#manual a {
  display: block; padding: 12px 20px; border-radius: 8px; background: #4f46e5;
  color: #fff; text-decoration: none; font-weight: 600;
}
#manual a.secondary { background: #e5e7eb; color: #171717; }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<h1 class="brand">Neurova</h1>
<div class="spinner" id="spinner" aria-hidden="true"></div>
<p id="status" role="status" aria-live="polite">Taking you to Neurova...</p>

<div id="manual">
  <p>Not redirecting? Choose a version:</p>
  <a id="link-a" href="https://neurova-one.vercel.app/?from=go&amp;variant=a">Open Neurova</a>
  <a id="link-b" class="secondary" href="https://neurova-two.vercel.app/?from=go&amp;variant=b">Open Neurova (alternate)</a>
</div>

<noscript>
  <p>Automatic redirection needs JavaScript. Choose a version:</p>
  <p><a href="https://neurova-one.vercel.app/?from=go&amp;variant=a">Open Neurova</a></p>
  <p><a href="https://neurova-two.vercel.app/?from=go&amp;variant=b">Open Neurova (alternate)</a></p>
</noscript>

<script>
(function () {
  // ===== SETTINGS: edit these destinations and weights =====
  var VARIANTS = [
    { id: "a", url: "https://neurova-one.vercel.app/", weight: 50 },
    { id: "b", url: "https://neurova-two.vercel.app/", weight: 50 }
  ];
  var KEY = "neurova_split_variant";
  var COOKIE_DAYS = 365;
  var FALLBACK_MS = 2500;
  // =========================================================

  var manual = document.getElementById("manual");
  var spinner = document.getElementById("spinner");
  var statusEl = document.getElementById("status");
  var ua = navigator.userAgent || "";
  // Link-preview and crawler bots must see this page, not be redirected.
  var isBot = /bot|crawl|spider|slurp|facebookexternalhit|whatsapp|telegram|twitterbot|linkedinbot|preview|slack|discord|viber|applebot|embedly|pinterest|skype/i.test(ua);

  function showManual(message) {
    spinner.style.display = "none";
    statusEl.textContent = message || "Choose a Neurova version:";
    manual.style.display = "flex";
  }
  function find(id) {
    for (var i = 0; i < VARIANTS.length; i++) if (VARIANTS[i].id === id) return VARIANTS[i];
    return null;
  }
  function readCookie() {
    var prefix = KEY + "=";
    var cookies = document.cookie ? document.cookie.split("; ") : [];
    for (var i = 0; i < cookies.length; i++) {
      if (cookies[i].indexOf(prefix) === 0) {
        try { return decodeURIComponent(cookies[i].slice(prefix.length)); } catch (e) { return null; }
      }
    }
    return null;
  }
  function readStored() {
    var value = null;
    try { value = localStorage.getItem(KEY); } catch (e) {}
    if (!value) value = readCookie();
    return value;
  }
  function store(id) {
    try { localStorage.setItem(KEY, id); } catch (e) {}
    try {
      document.cookie = KEY + "=" + encodeURIComponent(id) + "; max-age=" + (COOKIE_DAYS * 86400) + "; path=/; SameSite=Lax; Secure";
    } catch (e) {}
  }
  function clearStored() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    try { document.cookie = KEY + "=; max-age=0; path=/; SameSite=Lax; Secure"; } catch (e) {}
  }
  function pickWeighted() {
    var total = 0, i;
    for (i = 0; i < VARIANTS.length; i++) total += Math.max(0, Number(VARIANTS[i].weight) || 0);
    if (!VARIANTS.length) return null;
    if (total <= 0) return VARIANTS[0];
    var r = Math.random() * total, acc = 0;
    for (i = 0; i < VARIANTS.length; i++) {
      acc += Math.max(0, Number(VARIANTS[i].weight) || 0);
      if (r < acc) return VARIANTS[i];
    }
    return VARIANTS[VARIANTS.length - 1];
  }
  // Adds the tags that let you tell the two versions apart in analytics.
  // Existing campaign tags (utm_*) from the visitor's link are never overwritten.
  function tag(url, variant) {
    url.searchParams.set("from", "go");
    url.searchParams.set("variant", variant.id);
    if (!url.searchParams.has("utm_source"))  url.searchParams.set("utm_source", "go");
    if (!url.searchParams.has("utm_medium"))  url.searchParams.set("utm_medium", "split");
    if (!url.searchParams.has("utm_content")) url.searchParams.set("utm_content", "variant-" + variant.id);
    return url;
  }
  function trackedUrl(variant) { return tag(new URL(variant.url), variant).href; }

  // Keep the visible fallback links in sync with the configured destinations.
  if (VARIANTS.length >= 2) {
    document.getElementById("link-a").href = trackedUrl(VARIANTS[0]);
    document.getElementById("link-b").href = trackedUrl(VARIANTS[1]);
  }

  if (isBot) { showManual("Choose a Neurova version:"); return; }

  var fallbackTimer = window.setTimeout(function () {
    showManual("Automatic redirection did not work. Choose a version:");
  }, FALLBACK_MS);

  try {
    var params = new URLSearchParams(window.location.search);
    // ?reset=1 clears the saved choice and triggers a fresh random assignment.
    if (params.has("reset")) clearStored();

    var chosen = null;
    var forced = params.get("v");
    // Testing override: ?v=a or ?v=b (not saved).
    if (forced) chosen = find(forced);
    // Returning visitors stay on their previous variant.
    if (!chosen) chosen = find(readStored());
    // New visitors are assigned using the configured weights.
    if (!chosen) {
      chosen = pickWeighted();
      if (!chosen) throw new Error("No redirect destinations are configured.");
      store(chosen.id);
    }

    var destination = new URL(chosen.url);
    // Forward the visitor's own query parameters (such as UTM tags), except the control ones.
    params.forEach(function (value, name) {
      if (name !== "v" && name !== "reset") destination.searchParams.set(name, value);
    });
    tag(destination, chosen);
    destination.hash = window.location.hash;

    window.clearTimeout(fallbackTimer);
    window.location.replace(destination.href);
  } catch (error) {
    window.clearTimeout(fallbackTimer);
    showManual("We couldn't redirect you automatically. Choose a version:");
  }
})();
</script>
</body>
</html>
